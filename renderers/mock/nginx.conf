worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 256k;
    gzip on;
    gzip_types application/json application/javascript text/css;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root /srv/app;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location = / { root /srv/twin; try_files /index.html =404; add_header Cache-Control no-store; }
        location = /twin/ { root /srv/twin; try_files /index.html =404; add_header Cache-Control no-store; }
        location = /twin/app.js { alias /srv/twin/app.js; }
        location = /twin/grid.js { alias /srv/twin/grid.js; }
        location = /twin/wind-estimate.mjs { alias /srv/twin/wind-estimate.mjs; default_type application/javascript; }
        location = /twin/playback.mjs { alias /srv/twin/playback.mjs; default_type application/javascript; }
        location = /twin/style.css { alias /srv/twin/style.css; }
        location = /twin/manifest.json { alias /srv/twin-data/manifest.json; add_header Cache-Control no-cache; }
        location = /twin/CREDITS.txt { alias /srv/twin-data/CREDITS.txt; default_type text/plain; }
        location = /twin/scene.glb { alias /srv/twin-data/scene.glb; default_type model/gltf-binary; add_header Cache-Control no-cache; }
        location = /twin/turbine.glb { alias /srv/twin-data/turbine.glb; default_type model/gltf-binary; add_header Cache-Control no-cache; }
        location = /grid/manifest.json { alias /srv/grid-data/manifest.json; add_header Cache-Control no-cache; }
        location = /grid/scene.glb { alias /srv/grid-data/scene.glb; default_type model/gltf-binary; add_header Cache-Control no-cache; }
        location = /grid/CREDITS.txt { alias /srv/grid-data/CREDITS.txt; default_type text/plain; }
        location = /local/manifest.json { alias /srv/local-data/manifest.json; add_header Cache-Control no-cache; }
        location = /local/scene.glb { alias /srv/local-data/scene.glb; default_type model/gltf-binary; add_header Cache-Control no-cache; }
        location = /local/CREDITS.txt { alias /srv/local-data/CREDITS.txt; default_type text/plain; }
        location = /site/ { root /srv/site-data; try_files /index.html =404; add_header Cache-Control no-store; }
        location = /site/app.js { alias /srv/site/app.js; }
        location = /site/style.css { alias /srv/site/style.css; }
        location = /site/buildings.geojson { alias /srv/site-data/buildings.geojson; default_type application/geo+json; }
        location = /mock/ { try_files /index.html =404; }
        location ~ ^/(app.js|model.js|style.css)$ { try_files $uri =404; }
        location /vendor/ { alias /srv/three/; }
        location = /scene.json { alias /srv/data/scene.json; add_header Cache-Control no-cache; }
        location = /omniverse/jeju-mock.png { alias /srv/omniverse/jeju-mock.png; }
        location = /omniverse/jeju-mock.usda { alias /srv/omniverse/jeju-mock.usda; }
        location = /omniverse/twin-close.png { alias /srv/twin-rtx/close.png; }
        location = /omniverse/twin-array.png { alias /srv/twin-rtx/array.png; }
        location = /omniverse/twin.usda { alias /srv/twin-rtx/estimated-turbines.usda; }
        location = /omniverse/grid-line.png { alias /srv/grid-rtx/inspect.png; }
        location = /omniverse/grid-terrain.png { alias /srv/grid-rtx/overview.png; }
        location = /omniverse/grid-pv.png { alias /srv/grid-rtx/pv.png; }
        location = /omniverse/grid.usda { alias /srv/grid-rtx/estimated-scene.usda; }
        location = /omniverse/local-array.png { alias /srv/local-rtx/array.png; }
        location = /omniverse/local-overview.png { alias /srv/local-rtx/overview.png; }
        location = /omniverse/local-pv.png { alias /srv/local-rtx/pv.png; }
        location = /omniverse/local-terrain.png { alias /srv/local-rtx/terrain.png; }
        location = /omniverse/local.usda { alias /srv/local-rtx/estimated-scene.usda; }
        location /api/ {
            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 90s;
            proxy_buffering off;
        }
        location / { return 404; }
    }
}
